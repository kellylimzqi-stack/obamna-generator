<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Obama Generator</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family: 'Comic Sans MS', 'Comic Sans', cursive;
background:#9DD9ED;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.container{
max-width:650px;
padding:40px;
background:white;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.15);
}

h1{
font-size:38px;
margin-bottom:5px;
}

.subtitle{
font-size:14px;
opacity:0.6;
margin-bottom:30px;
}

.quote{
font-size:28px;
line-height:1.4;
margin-bottom:35px;
min-height:90px;
transition:opacity .2s;
}

button{
padding:14px 26px;
font-size:18px;
border:none;
border-radius:999px;
cursor:pointer;
background:#E9F7FB;
font-weight:600;
}

button:hover{
transform:scale(1.05);
}

.secondary{
margin-top:10px;
background:#eee;
}

.hidden{
display:none;
}

@media (max-width:600px){

.container{
padding:25px;
margin:15px;
}

h1{
font-size:30px;
}

.quote{
font-size:22px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>Obama Generator</h1>
<p class="subtitle">real quotes by obma</p>

<div id="quote" class="quote"></div>

<button id="startBtn" onclick="randomQuote()">generate obama</button>

<br>

<button id="nextBtn" class="secondary hidden" onclick="randomQuote()">give me another one</button>

<br>

<button id="copyBtn" class="secondary hidden" onclick="copyQuote()">copy quote</button>

</div>

<script>

const quotes = [
"Almost Transparent Obama: let me be sheer",
"Metamorphosized into a saline water Obama: let me be tear",
"Obama at a horror house: uhhhhh let me be fear",
"Obama as a prey animal in a temperate rainforest: uhhhh let me be deer",
"lgbtq obama: uhhh let me be queer",
"Obama a little annoyed: uhhhhh let me be sneer",
"Humble obama: uhhhh let me be mere",
"Alcoholic Obama: uhhhhhh let me be Beer",
"Obama reviewing a paper: uhhh let me be peer",
"Obama in the corporate world: uhhhhh let me be gear",
"Obama at the dentist: uhhh let me be veneer",
"Obama as the helmsman of the exploratory vessel that voyaged to America: uhhhh let me be steer",
"Obama being present: uhhhh let me be here",
"Obama being present: uhhhh let me be near",
"Obama finger painting: uhhh let me be smear",
"Obama enjoying his favorite sport: uhhhhh let me be cheer",
"Chef obama: uhhh let me be sear",
"Oracle obame: uhhhh let me be seer",
"Obama listening: uhhh let me be ear",
"Neo pronoun obama: uuuuhhh let me be zir",
"Obama respresenting a bunch of ppl: uhhh let me be we're",
"obama off course: uhhhh let me be veer",
"Bottom obama: uhhhh let me be rear",
"weaponized Obama: uhhhh let me be spear",
"Obama as 365 days: uhhh let me be year",
"Orb-ama: Uhhh let me be sphere",
"Obama when he needs more wool: uhhhh let me be shear",
"Obama when he knows I need a friend: uhhhh lemme be peer",
"Precious Obama: uhhh let me be dear",
"Obama incensing the house: uhhhh let me be myrrh",
"Obama as water in Malaysia: uhhh let me be air"
];

function randomQuote(){

const random = quotes[Math.floor(Math.random()*quotes.length)];

const box = document.getElementById("quote");

box.style.opacity=0;

setTimeout(()=>{
box.textContent=random;
box.style.opacity=1;
},120);

document.getElementById("startBtn").classList.add("hidden");
document.getElementById("nextBtn").classList.remove("hidden");
document.getElementById("copyBtn").classList.remove("hidden");

}

function copyQuote(){
navigator.clipboard.writeText(document.getElementById("quote").textContent);
}

</script>

</body>
</html>
