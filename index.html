let remaining=[];

function rebuildPool(){
remaining=[];
quotes.forEach(q=>{
for(let i=0;i<q.w;i++){
remaining.push(q.t);
}
});
}

rebuildPool();

function randomQuote(){

if(remaining.length===0){
rebuildPool();
}

const i=Math.floor(Math.random()*remaining.length);
const q=remaining.splice(i,1)[0];

const box=document.getElementById("quote");

document.getElementById("startBtn").classList.add("hidden");
document.getElementById("footer").classList.remove("hidden");
document.querySelector(".container").classList.add("expanded");
document.getElementById("logo").classList.add("hidden");
  
box.classList.remove("hidden");

/* typing animation */

const typingText="uhhhh...";
box.textContent="";

let index=0;

const typing=setInterval(()=>{

box.textContent += typingText[index];

index++;

if(index>=typingText.length){

clearInterval(typing);

setTimeout(()=>{
box.textContent=q;
},200);

}

},40);

}

function copyQuote(){

const text=document.getElementById("quote").textContent;
navigator.clipboard.writeText(text);

const btn=document.getElementById("copyBtn");

btn.textContent="copied 👍";

setTimeout(()=>{
btn.textContent="copy quote";
},1200);
}

function shareQuote(){

const quote=document.getElementById("quote").textContent;
const shareText = quote + " — Obama Generator";
const url = window.location.href;

/* detect mobile */

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

if(isMobile && navigator.share){

navigator.share({
title:"Obama Generator",
text:shareText,
url:url
});

}else{

/* desktop fallback */

const encoded = encodeURIComponent(shareText + " " + url);

window.open(
"https://twitter.com/intent/tweet?text=" + encoded,
"_blank"
);

}

}
